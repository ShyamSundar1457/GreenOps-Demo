name: Carbon-Heavy Self-Hosted Workflow

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# ❌ No concurrency control — stacks up on your local machine
# concurrency: intentionally omitted

jobs:

  # ──────────────────────────────────────────────
  # JOB 1: Bloated matrix across Node versions
  # All legs run on YOUR machine simultaneously
  # ──────────────────────────────────────────────
  bloated-matrix:
    name: Build (Node ${{ matrix.node }})
    runs-on: self-hosted          # ← targets your local runner
    strategy:
      fail-fast: false            # ❌ all legs keep running even if one fails
      matrix:
        node: [14, 16, 18, 20, 21, 22]   # 6 parallel jobs on your machine

    defaults:
      run:
        shell: pwsh               # use PowerShell Core on Windows

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ❌ full git history clone every time

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # ❌ no cache: key omitted

      - name: Install dependencies (no cache)
        run: npm install          # ❌ cold install every time

      - name: Reinstall dependencies (redundant)
        run: npm install          # ❌ exact duplicate

      - name: Sleep — idle your CPU for 2 minutes
        run: Start-Sleep -Seconds 120   # PowerShell equivalent of sleep 120

      - name: Run tests (x3)
        run: |
          npm test -- --verbose
          npm test -- --verbose
          npm test -- --verbose   # ❌ full test suite three times

      - name: Build (x2)
        run: |
          npm run build
          npm run build           # ❌ rebuild immediately

      - name: Upload artifact per Node version
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node }}
          path: dist\
          retention-days: 90      # ❌ 6 identical artifacts stored for 90 days

  # ──────────────────────────────────────────────
  # JOB 2: Lint — waits for all 6 matrix legs, then re-installs
  # ──────────────────────────────────────────────
  lint:
    name: Lint (redundant)
    runs-on: self-hosted
    needs: bloated-matrix         # ❌ waits for all 6 jobs before starting
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install          # ❌ another cold install

      - name: Lint (x3)
        run: |
          npm run lint
          npm run lint
          npm run lint

  # ──────────────────────────────────────────────
  # JOB 3: Security audit — same pattern, re-installs again
  # ──────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: self-hosted
    needs: bloated-matrix
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Audit (x3)
        run: |
          npm audit
          npm audit
          npm audit

  # ──────────────────────────────────────────────
  # JOB 4: Download all artifacts and idle
  # ──────────────────────────────────────────────
  useless-aggregator:
    name: Useless Aggregation
    runs-on: self-hosted
    needs: [lint, security]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts     # ❌ downloads all 6 artifacts locally

      - name: Idle for 3 minutes
        run: Start-Sleep -Seconds 180

      - name: Count files (only real work)
        run: |
          $count = (Get-ChildItem -Recurse -File all-artifacts).Count
          Write-Host "Total files: $count"

  # ──────────────────────────────────────────────
  # JOB 5: Spam loop — 10 × 30 s sleeps
  # ──────────────────────────────────────────────
  notify:
    name: Notify Team (x10)
    runs-on: self-hosted
    needs: useless-aggregator
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Spam loop
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Sending notification $i..."
            Start-Sleep -Seconds 30   # ❌ 5 extra minutes of idle CPU
          }
