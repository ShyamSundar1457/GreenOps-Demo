name: Fast Self-Hosted Workflow (~5 min)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node version  # uses whatever Node is installed on your machine
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test & Build
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist\
          retention-days: 7

  summary:
    name: Summary
    runs-on: self-hosted
    needs: [lint, test]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Done
        run: Write-Host "All jobs passed successfully!"
