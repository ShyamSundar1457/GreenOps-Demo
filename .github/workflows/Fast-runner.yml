name: Fast Self-Hosted Workflow (~5 min)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true        # ✅ cancels old run if a new push comes in

jobs:

  # ──────────────────────────────────────────────
  # JOB 1 + 2: Lint & Test run in PARALLEL (~3 min)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ shallow clone (default fetch-depth: 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"              # ✅ caches node_modules between runs

      - name: Install dependencies
        run: npm ci                 # ✅ faster & deterministic vs npm install

      - name: Lint
        run: npm run lint

  test:
    name: Test & Build
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"              # ✅ shared cache with lint job

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist\
          retention-days: 7         # ✅ short retention, only 1 artifact

  # ──────────────────────────────────────────────
  # JOB 3: Quick summary — runs after both (~30 sec)
  # ──────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: self-hosted
    needs: [lint, test]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Done
        run: Write-Host "All jobs passed successfully!"
